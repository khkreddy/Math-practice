name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -v
      - name: No private material in the tree
        run: |
          # systems/modify is the copied harness. It names its source tree and
          # keeps those local fallback paths. Everywhere else, that name is still
          # private material, as are the other patterns in the whole tree.
          if grep -R -n -E 'iisc@gmail|student_response|page3\.jpeg' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github . \
            || grep -R -n -E 'TTwin-final' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github \
            --exclude-dir=modify . ; then
            echo "private material matched" >&2
            exit 1
          fi

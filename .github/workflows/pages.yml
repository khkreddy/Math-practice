# The live quiz is Cloudflare Pages, deployed from the admin machine:
#   npx wrangler pages deploy web --project-name math-practice --branch main
# This file remains so a public GitHub Pages site can still be published.
# On a private repo, Pages may be unavailable. This job is allowed to fail
# so that does not block the repository. Do not add a workflow that needs
# a Cloudflare API token.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
